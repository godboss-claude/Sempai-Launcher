plugins {
 id 'fabric-loom' version "${loom_version}"
 id 'legacy-looming' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'sempai-visuals-1.12.2' }
repositories { maven { url = 'https://repo.legacyfabric.net/legacyfabric/' } }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.legacyfabric:yarn:${project.yarn_build}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.legacyfabric.legacy-fabric-api:legacy-fabric-api:${project.fabric_version}"
}
processResources {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
